name: Atualizar dados e publicar o app

on:
  schedule:
    # 01:17 UTC = 22:17 em Brasília, de terça a sábado UTC (= segunda a sexta no Brasil), depois do fechamento.
    # Minuto 17, e não 0: na hora cheia a fila de agendamentos do GitHub atrasa e pode descartar execuções.
    - cron: "17 1 * * 2-6"
    # Segunda tentativa na manhã seguinte (09:17 em Brasília), caso o arquivo da B3 tenha saído tarde.
    - cron: "17 12 * * 2-6"
  workflow_dispatch:
    inputs:
      ano:
        description: "ANO (opcional): preencher os fechamentos do ano inteiro, ex.: 2026. Só na primeira execução."
        required: false
      validar:
        description: "VALIDAR: conferir o leitor com o arquivo real da B3 de 30/12/2025 antes de gravar."
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Se o leitor não reproduzir o snapshot (gerado pelo rb3) com o arquivo real, o job para aqui e nada é gravado nem publicado.
      - name: Validar o leitor com o arquivo real da B3 (opcional)
        if: ${{ inputs.validar }}
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0" -o "$RUNNER_TEMP/COTAHIST_D30122025.ZIP" \
            "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D30122025.ZIP"
          python atualizar_dados.py --validar "$RUNNER_TEMP/COTAHIST_D30122025.ZIP"

      - name: Preencher o ano (opcional)
        if: ${{ github.event.inputs.ano != '' }}
        run: python atualizar_dados.py --ano "${{ github.event.inputs.ano }}"

      - name: Baixar o fechamento mais recente da B3
        run: python atualizar_dados.py

      - name: Gerar o app
        run: |
          python build.py
          python build_pwa.py

      # Confere montador.py × montador.js com os dados do dia. Não bloqueia: os preços novos são publicados mesmo
      # que apareça divergência; o passo fica vermelho no log para ser investigado.
      - name: Paridade com os dados do dia (não bloqueia a publicação)
        continue-on-error: true
        run: python paridade.py

      - name: Guardar o snapshot novo no repositório
        run: |
          git config user.name "atualizador-de-dados"
          git config user.email "atualizador@users.noreply.github.com"
          git add snapshot.json
          git diff --cached --quiet || git commit -m "Dados do pregão $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deploy
        uses: actions/deploy-pages@v4
