name: Pesquisa da tendência do minigráfico

# Back-test das regras de cor do minigráfico (pesquisa/tendencia.py) com os COTAHIST anuais da B3, 2015 até o ano
# corrente: com e sem IFR, e a faixa de ±3% publicada hoje. Só leitura: não grava nada no repositório.
on:
  workflow_dispatch:
  push:
    branches: [tendencia]
    paths:
      - "pesquisa/tendencia.py"
      - "montador.py"
      - ".github/workflows/tendencia.yml"

permissions:
  contents: read

concurrency:
  group: pesquisa-tendencia
  cancel-in-progress: true

jobs:
  tendencia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependências (versão fixa)
        run: pip install --quiet numpy==2.1.3

      - name: Baixar os COTAHIST anuais da B3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cotahist"
          for a in $(seq 2015 "$(date -u +%Y)"); do
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o "$RUNNER_TEMP/cotahist/COTAHIST_A$a.ZIP" \
              "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A$a.ZIP"
            echo "COTAHIST_A$a.ZIP: $(du -h "$RUNNER_TEMP/cotahist/COTAHIST_A$a.ZIP" | cut -f1)"
          done

      - name: Back-test
        run: python pesquisa/tendencia.py --zips "$RUNNER_TEMP/cotahist" --saida "$RUNNER_TEMP/tendencia.txt"

      - uses: actions/upload-artifact@v6
        with:
          name: pesquisa-tendencia
          path: ${{ runner.temp }}/tendencia.txt
          retention-days: 30
