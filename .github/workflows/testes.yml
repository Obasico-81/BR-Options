name: Testes

# Roda a cada mudança de código na main: paridade montador.py × montador.js (snapshot atual e o de 30/12/2025),
# cenários do atualizador e as telas do app no navegador. Os commits diários do snapshot (feitos pelo próprio
# workflow de atualização) não disparam este; a paridade com o dado do dia roda lá, sem bloquear a publicação.
on:
  push:
    branches: [main]
    paths:
      - "montador.js"
      - "aovivo.js"
      - "supabase/**"
      - "montador.py"
      - "pwa/sw.js"
      - "paridade.py"
      - "template.html"
      - "atualizar_dados.py"
      - "build.py"
      - "build_pwa.py"
      - "build_nativo.py"
      - "build_site.py"
      - "testes/**"
      - ".github/workflows/testes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Gerar o app
        run: |
          python build.py
          python build_pwa.py

      - name: Paridade montador.py × montador.js (snapshot atual)
        run: python paridade.py

      - name: Paridade no snapshot original (30/12/2025)
        run: |
          d="$RUNNER_TEMP/paridade_base"; mkdir -p "$d"
          cp montador.py montador.js paridade.py atualizar_dados.py "$d/"; cp testes/snapshot_base.json "$d/snapshot.json"
          cd "$d" && python paridade.py

      - name: Atualizador (servidor local que imita a B3)
        run: python -I testes/teste_atualizador.py .

      - name: Telas do app no navegador
        run: |
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium
          node testes/smoke.js "$PWD/pwa/index.html"

      - name: Site no domínio (páginas na raiz, /bolsa-brasileira/ e /instalar/; app em /app/; endereços antigos e dados na raiz)
        run: |
          pip install --quiet segno==1.6.6
          python build_site.py
          node testes/site.js

      - name: Marcação diária (contas e app servido por HTTP)
        run: node testes/marcacao.js

      - name: Ao vivo — preço de execução, regras a cada cotação, fonte simulada e telas
        run: node testes/aovivo.js

      - name: Plano grátis × Vaglio Pro (opções e tempo real só no Pro; assinar, voltar do pagamento e cancelar)
        run: node testes/assinatura.js

      - name: Regras da assinatura (teste grátis, períodos pagos, carência, cancelamento, avisos do Asaas)
        run: node --experimental-strip-types testes/assinatura_regras.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Functions da assinatura (tipos e lint)
        working-directory: supabase/functions
        run: deno check assinar/index.ts asaas-webhook/index.ts cancelar-assinatura/index.ts && deno lint

      - name: Números no formato brasileiro (vírgula, ponto de milhar)
        run: node testes/numeros.js

      - name: App nativo — dados do site, cópia no aparelho e snapshot embutido
        run: node testes/nativo.js

      - name: Operação real — registrar, acompanhar, encerrar e Desempenho
        run: node testes/real.js

      - name: Avisos do app nativo (componente simulado)
        run: node testes/avisos.js

      - name: Vitrine — tudo o que dá para montar hoje, em todos os ativos
        run: node testes/vitrine.js "$PWD/pwa/index.html"

      - name: Perfis da trava (Lucro maior, Equilibrada, Lucro frequente)
        run: node testes/perfis_trava.js "$PWD/pwa/index.html"

      - name: Conta — entrar com código, cópia entre aparelhos, sair e excluir (Supabase simulado)
        run: node testes/conta.js "$PWD/pwa/index.html"

      - name: Layout de computador (menu lateral, colunas, tabelas, de 1024 a 1920px)
        run: node testes/desktop.js

      - name: Snapshot publicado (só o pregão mais recente)
        run: python testes/publicado.py
