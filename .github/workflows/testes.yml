name: Testes

# Roda a cada mudança de código na main: paridade montador.py × montador.js (snapshot atual e o de 30/12/2025),
# cenários do atualizador e as telas do app no navegador. Os commits diários do snapshot (feitos pelo próprio
# workflow de atualização) não disparam este; a paridade com o dado do dia roda lá, sem bloquear a publicação.
on:
  push:
    branches: [main]
    paths:
      - "montador.js"
      - "montador.py"
      - "pwa/sw.js"
      - "paridade.py"
      - "template.html"
      - "atualizar_dados.py"
      - "build.py"
      - "build_pwa.py"
      - "build_nativo.py"
      - "testes/**"
      - ".github/workflows/testes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Gerar o app
        run: |
          python build.py
          python build_pwa.py

      - name: Paridade montador.py × montador.js (snapshot atual)
        run: python paridade.py

      - name: Paridade no snapshot original (30/12/2025)
        run: |
          d="$RUNNER_TEMP/paridade_base"; mkdir -p "$d"
          cp montador.py montador.js paridade.py "$d/"; cp testes/snapshot_base.json "$d/snapshot.json"
          cd "$d" && python paridade.py

      - name: Atualizador (servidor local que imita a B3)
        run: python -I testes/teste_atualizador.py .

      - name: Telas do app no navegador
        run: |
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium
          node testes/smoke.js "$PWD/pwa/index.html"

      - name: Marcação diária (contas e app servido por HTTP)
        run: node testes/marcacao.js

      - name: Números no formato brasileiro (vírgula, ponto de milhar)
        run: node testes/numeros.js

      - name: App nativo — dados do site, cópia no aparelho e snapshot embutido
        run: node testes/nativo.js

      - name: Operação real — registrar, acompanhar, encerrar e Desempenho
        run: node testes/real.js

      - name: Cópia dos dados — exportar e importar
        run: node testes/copia.js

      - name: Avisos do app nativo (componente simulado)
        run: node testes/avisos.js
