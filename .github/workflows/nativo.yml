name: App nativo (Android e iPhone)

# Gera o app de Android (APK instalável fora da loja: de produção, com a chave dos segredos, ou de teste) e o de
# iPhone (para o simulador, com uma foto da tela aberta) a partir de nativo/ (Capacitor), com o mesmo código do site.
# Os dados do dia o app baixa do site publicado.
# Envio às lojas (Google Play e App Store) entra quando existirem as contas.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nativo/**"
      - "build.py"
      - "build_nativo.py"
      - "template.html"
      - "montador.js"
      - "aovivo.js"
      - ".github/workflows/nativo.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # só para atualizar a página de download do APK (releases android e android-teste)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: O site publicado libera os dados para o app (CORS)
        shell: bash
        run: |
          h=$(curl -sSI https://vaglio.com.br/app/ | tr -d '\r')
          echo "$h" | grep -iE "^HTTP/|^access-control-allow-origin"
          echo "$h" | grep -qi "^access-control-allow-origin: \*"

      - name: Código do app
        run: |
          python build.py
          python build_nativo.py

      - name: Capacitor
        working-directory: nativo
        run: |
          npm ci
          npx cap sync android

      # Chave de produção: só nos segredos do repositório (Settings → Secrets and variables → Actions). Sem ela, o
      # workflow gera o APK de teste de sempre (chave de teste do repositório, com depuração).
      - name: Chave de produção
        id: chave
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/vaglio.keystore"
            echo "loja=sim" >> "$GITHUB_OUTPUT"; echo "Com a chave de produção: APK assinado, sem depuração."
          else
            echo "loja=nao" >> "$GITHUB_OUTPUT"; echo "Sem a chave de produção: só o APK de teste."
          fi

      - name: Gerar o APK
        working-directory: nativo/android
        shell: bash
        env:
          VERSAO_CODIGO: ${{ github.run_number }}
          VERSAO_NOME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_ARQUIVO: ${{ steps.chave.outputs.loja == 'sim' && format('{0}/vaglio.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_CHAVE_ALIAS: ${{ secrets.ANDROID_CHAVE_ALIAS }}
          ANDROID_CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          if [ "${{ steps.chave.outputs.loja }}" = sim ]; then
            ./gradlew assembleRelease --no-daemon
            ls app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: nativo/android/app/build/outputs/apk/*/*.apk
          retention-days: 14

      # Link público e fixo (sem login no GitHub), só a partir da main; cada build substitui o arquivo e instala por cima
      # do anterior. Com a chave de produção: release "android" (o link das páginas). Sem ela: release "android-teste".
      - name: Publicar o APK (link fixo)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.chave.outputs.loja }}" = sim ]; then
            TAG=android; TITULO="Vaglio para Android"; PRE=""
            APK=nativo/android/app/build/outputs/apk/release/app-release.apk
            NOTAS="Vaglio para Android, versão 1.0.${GITHUB_RUN_NUMBER}, de $(date -u +%d/%m/%Y) (${GITHUB_SHA::7}). Instalação fora da Play Store: o celular pede para permitir apps desta fonte."
          else
            TAG=android-teste; TITULO="App de teste (Android)"; PRE="--prerelease"
            APK=$(ls nativo/android/app/build/outputs/apk/debug/*.apk | head -1)
            NOTAS="APK de teste do Android, gerado da main em $(date -u +%d/%m/%Y) (${GITHUB_SHA::7}). Instalar fora da loja: permitir apps de fontes desconhecidas. Os dados do dia vêm do site publicado."
          fi
          cp "$APK" "$RUNNER_TEMP/vaglio.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $PRE --target main --title "$TITULO" --notes "$NOTAS"
          gh release edit "$TAG" --notes "$NOTAS"
          gh release upload "$TAG" "$RUNNER_TEMP/vaglio.apk" --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/vaglio.apk"

  iphone:
    runs-on: macos-latest
    timeout-minutes: 55
    permissions:
      contents: write   # só para publicar a foto da tela no branch capturas
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Código do app
        run: |
          python build.py
          python build_nativo.py

      - name: Capacitor
        working-directory: nativo
        run: |
          npm ci
          npx cap sync ios

      - name: Compilar para o simulador
        working-directory: nativo/ios/App
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Guardar o app compilado
        shell: bash
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"; echo "APP=$APP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/iphone"
          (cd "$(dirname "$APP")" && zip -qr "$RUNNER_TEMP/iphone/app-simulador.zip" "$(basename "$APP")")

      # Cada comando com limite de tempo e hora no log: a primeira versão travou aqui sem dizer onde.
      - name: Abrir no simulador e fotografar a tela
        timeout-minutes: 30
        shell: bash
        run: |
          passo() { echo "[$(date -u +%H:%M:%S)] $*"; }
          limite() { local t=$1; shift; "$@" & local p=$!; for _ in $(seq 1 "$t"); do kill -0 $p 2>/dev/null || { wait $p; return $?; }; sleep 1; done; kill $p 2>/dev/null; passo "passou de ${t}s: $*"; return 124; }
          passo "runtimes"; xcrun simctl list runtimes | grep -i ios
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))')
          passo "simulador $UDID"; xcrun simctl list devices | grep "$UDID"
          limite 300 xcrun simctl boot "$UDID"
          for i in $(seq 1 60); do xcrun simctl list devices | grep "$UDID" | grep -q Booted && break; sleep 5; done
          passo "estado: $(xcrun simctl list devices | grep "$UDID")"
          limite 180 xcrun simctl install "$UDID" "$APP"; passo "instalado"
          ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          # abrir o app às vezes passa de 2 min nestas máquinas (2 em 5 builds até 05/11/2026): até 5 min, e uma 2ª tentativa
          limite 300 xcrun simctl launch "$UDID" "$ID" || { passo "2ª tentativa de abrir"; xcrun simctl terminate "$UDID" "$ID" 2>/dev/null; limite 300 xcrun simctl launch "$UDID" "$ID"; }
          passo "aberto ($ID)"
          sleep 30
          limite 60 xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/iphone/tela.png"; passo "foto tirada"

      # A foto também vai para o branch capturas (sobrescrito a cada execução): dá para ver no GitHub sem baixar
      # o artefato. A primeira inicialização do simulador leva ~9 min nestas máquinas.
      - name: Publicar a foto no branch capturas
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cap" && cd "$RUNNER_TEMP/cap"
          git init -q -b capturas
          cp "$RUNNER_TEMP/iphone/tela.png" iphone.png
          git add iphone.png
          git -c user.name="app-nativo" -c user.email="app-nativo@users.noreply.github.com" commit -q -m "Tela do app no simulador de iPhone (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: iphone-simulador
          path: ${{ runner.temp }}/iphone
          retention-days: 14
