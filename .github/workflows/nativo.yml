name: App nativo (Android e iPhone)

# Gera o app de Android (APK de teste, instalável fora da loja) e o de iPhone (para o simulador, com uma foto da tela
# aberta) a partir de nativo/ (Capacitor), com o mesmo código do site. Os dados do dia o app baixa do site publicado.
# Ainda sem assinatura de loja: isso entra quando existirem as contas da Google Play e da Apple.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nativo/**"
      - "build.py"
      - "build_nativo.py"
      - "template.html"
      - "montador.js"
      - ".github/workflows/nativo.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # só para atualizar a página de download do APK de teste (release android-teste)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: O site publicado libera os dados para o app (CORS)
        shell: bash
        run: |
          h=$(curl -sSI https://obasico-81.github.io/BR-Options/ | tr -d '\r')
          echo "$h" | grep -iE "^HTTP/|^access-control-allow-origin"
          echo "$h" | grep -qi "^access-control-allow-origin: \*"

      - name: Código do app
        run: |
          python build.py
          python build_nativo.py

      - name: Capacitor
        working-directory: nativo
        run: |
          npm ci
          npx cap sync android

      - name: Gerar o APK de teste
        working-directory: nativo/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: android-apk-teste
          path: nativo/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Link público e fixo para quem for testar (sem login no GitHub). Só a partir da main; cada build substitui o
      # arquivo. O APK é assinado com a chave de teste do repositório, então instala por cima do anterior.
      - name: Publicar o APK de teste (link fixo)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls nativo/android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" "$RUNNER_TEMP/montador-de-opcoes-teste.apk"
          NOTAS="APK de teste do Android, gerado da main em $(date -u +%d/%m/%Y) (${GITHUB_SHA::7}). Instalar fora da loja: permitir apps de fontes desconhecidas. Os dados do dia vêm do site publicado."
          gh release view android-teste >/dev/null 2>&1 || gh release create android-teste --prerelease --target main --title "App de teste (Android)" --notes "$NOTAS"
          gh release edit android-teste --notes "$NOTAS"
          gh release upload android-teste "$RUNNER_TEMP/montador-de-opcoes-teste.apk" --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-teste/montador-de-opcoes-teste.apk"

  iphone:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write   # só para publicar a foto da tela no branch capturas
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Código do app
        run: |
          python build.py
          python build_nativo.py

      - name: Capacitor
        working-directory: nativo
        run: |
          npm ci
          npx cap sync ios

      - name: Compilar para o simulador
        working-directory: nativo/ios/App
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Guardar o app compilado
        shell: bash
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"; echo "APP=$APP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/iphone"
          (cd "$(dirname "$APP")" && zip -qr "$RUNNER_TEMP/iphone/app-simulador.zip" "$(basename "$APP")")

      # Cada comando com limite de tempo e hora no log: a primeira versão travou aqui sem dizer onde.
      - name: Abrir no simulador e fotografar a tela
        timeout-minutes: 20
        shell: bash
        run: |
          passo() { echo "[$(date -u +%H:%M:%S)] $*"; }
          limite() { local t=$1; shift; "$@" & local p=$!; for _ in $(seq 1 "$t"); do kill -0 $p 2>/dev/null || { wait $p; return $?; }; sleep 1; done; kill $p 2>/dev/null; passo "passou de ${t}s: $*"; return 124; }
          passo "runtimes"; xcrun simctl list runtimes | grep -i ios
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))')
          passo "simulador $UDID"; xcrun simctl list devices | grep "$UDID"
          limite 300 xcrun simctl boot "$UDID"
          for i in $(seq 1 60); do xcrun simctl list devices | grep "$UDID" | grep -q Booted && break; sleep 5; done
          passo "estado: $(xcrun simctl list devices | grep "$UDID")"
          limite 180 xcrun simctl install "$UDID" "$APP"; passo "instalado"
          ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          limite 120 xcrun simctl launch "$UDID" "$ID"; passo "aberto ($ID)"
          sleep 30
          limite 60 xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/iphone/tela.png"; passo "foto tirada"

      # A foto também vai para o branch capturas (sobrescrito a cada execução): dá para ver no GitHub sem baixar
      # o artefato. A primeira inicialização do simulador leva ~9 min nestas máquinas.
      - name: Publicar a foto no branch capturas
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cap" && cd "$RUNNER_TEMP/cap"
          git init -q -b capturas
          cp "$RUNNER_TEMP/iphone/tela.png" iphone.png
          git add iphone.png
          git -c user.name="app-nativo" -c user.email="app-nativo@users.noreply.github.com" commit -q -m "Tela do app no simulador de iPhone (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: iphone-simulador
          path: ${{ runner.temp }}/iphone
          retention-days: 14
