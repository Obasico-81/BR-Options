<title>Montador de Opções</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de celular (até 460px), quatro telas trocadas na própria página. Cores do canvas de telas aprovado. */
/* Tema: escuro por padrão para todos (decisão de 03/11/2026), independente do tema do aparelho. O claro fica
   disponível por data-theme="light" no <html>, sem opção na tela por enquanto. */
:root{
  --bg:#1E1E20; --surface:#28282B; --ink:#EDEBE4; --muted:#A9A7A0; --line:#3C3C40;
  --accent:#F5C400; --accent-ink:#1E1E20; --accent-soft:#2E2A16; --accent-text:#F5C400;
  --good:#7BD389; --good-soft:#1F3328; --bad:#FF8A7F; --bad-soft:#3A2220; --warn-soft:#3A2F14; --warn-text:#F0C060;
  --off:#2A2A2D; --track:#38383C; color-scheme:dark;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="light"]{
  --bg:#E3E3E0; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#4B5B6B; --line:#CBCBC7;
  --accent:#F5C400; --accent-ink:#0F1B2D; --accent-soft:#FFF3C4; --accent-text:#8A6500;
  --good:#17663F; --good-soft:#E1F3E8; --bad:#B42318; --bad-soft:#FBE4E1; --warn-soft:#FDF0D5; --warn-text:#7A4A00;
  --off:#D6D6D3; --track:#E8ECEF; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-variant-numeric:tabular-nums;font-size:16px;line-height:1.45}
.app{max-width:460px;margin:0 auto;padding:16px 16px 100px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.back{border:0;background:none;color:var(--accent-text);font:inherit;font-weight:600;min-height:44px;padding:0 8px 0 0;cursor:pointer}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--track);color:var(--muted)}
.pill.sim{background:var(--warn-soft);color:var(--warn-text);font-size:13px;padding:4px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.stat.risk{border:2px solid var(--bad);padding:13px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:25px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted)}
.v.good{color:var(--good)} .v.bad{color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>input,label.f>select{margin-top:auto}   /* caixas alinhadas pela base, mesmo com rótulo de 2 linhas ao lado */
.row3>div{display:flex;flex-direction:column}.row3>div>div:last-child{margin-top:auto}   /* idem para os valores (rótulo em cima, valor na base) */
input[type=number],input[type=text],select{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%;min-width:0}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.sec{padding-top:6px;display:flex;flex-direction:column;gap:10px}
.sec p{font-size:14px;color:var(--muted)}
.opt{display:flex;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.opt[disabled]{background:var(--off);border-style:dashed;color:var(--muted);cursor:not-allowed}
.opt .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:inline-flex;align-items:center;justify-content:center}
.opt[disabled] .ic{background:var(--line)}
.opt .tx{display:flex;flex-direction:column;gap:8px;min-width:0}
.opt .t{font-size:16px;font-weight:600;line-height:1.3}
.opt .st{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.step{display:flex;gap:12px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.step p{font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer;width:100%}
.btn[disabled]{background:var(--track);color:var(--muted);cursor:not-allowed}
.btn.sec2{background:transparent;color:var(--muted);font-size:15px;font-weight:600;min-height:44px}
.btn.danger{background:var(--surface);color:var(--bad);border:1.5px solid var(--bad);min-height:48px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:10px 0;border-top:1px solid var(--line)} tr:first-child td{border-top:0}
td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}
.det{display:block}.det>summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}.det>summary::-webkit-details-marker{display:none}.det>summary::after{content:"+";font-size:22px;font-weight:500;color:var(--muted)}.det[open]>summary::after{content:"−"}
.detc{display:flex;flex-direction:column;gap:10px;margin-top:12px}.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px}.kv>span:last-child{font-weight:700;white-space:nowrap}.kv.tot{border-top:1px solid var(--line);padding-top:10px}
.note{background:var(--accent-soft);border-radius:16px;padding:14px 16px;font-size:15px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;min-height:44px}
.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.bar{position:relative;height:10px;border-radius:999px;background:var(--track)}
.bar i{position:absolute;top:-3px;width:2px;height:16px;background:var(--muted)}
.bar b{position:absolute;height:10px;border-radius:999px}
input[type=range]{width:100%;min-height:44px;accent-color:var(--accent-text)}
.foot{font-size:12px;color:var(--muted);line-height:1.4}
.hide{display:none}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.leg{display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion:no-preference){.card,.stat,.opt{transition:border-color .15s}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent-text);font-weight:700}
</style>

<main class="app" id="app" aria-live="polite"></main>
<nav class="nav" id="nav" aria-label="Principal"></nav>

<script>/*MONTADOR*/</script>
<script>
const SNAP = /*SNAPSHOT*/;
const M = window.Montador;
const TESES = [
  {k:"alta_com_caixa", bloco:"Renda", desc:"Receber um prêmio agora, aceitando comprar a ação por um preço menor, com o caixa reservado.", frase:"Aceito comprar a ação por um preço menor e quero receber um prêmio", icone:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'},
  {k:"alta", bloco:"Direcional", desc:"Montar posição de alta ou de baixa, sabendo de antemão quanto vai arriscar.", frase:"Acho que vai subir e quero saber quanto vou arriscar", icone:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'},
  {k:"baixa", bloco:null, frase:"Acho que vai cair e quero saber quanto vou arriscar", icone:'<path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/>'},
  {k:"forte", bloco:"Estruturas de Volatilidade", desc:"Ganhar se o preço se mover muito, para qualquer lado, com risco máximo conhecido.", frase:"Acho que vai se mexer muito, mas não sei para que lado", icone:'<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>'}
];
const CORRETORAS = ["XP Investimentos","BTG Pactual","Clear","Rico","Inter","NuInvest","Genial","Itaú (Íon)","Bradesco","Safra","Toro","Outra"];
const DATAS = Object.keys(SNAP.por_data).sort();
let S = load("estado", {ativo:"PETR4", data:SNAP.data, capital:12000, perda:500, prazo:45, aposta:300, pf:"eq", sinal:{entrada:null, alvo:null, prazo:20, est:"trava"}});
S.cad = Object.assign({corretora:"", corretagem:null}, S.cad||{}); delete S.cad.nome; M.setCorretagem(S.cad.corretagem);   // o nome não era usado em lugar nenhum
// Tema: escuro por padrão; o claro é escolha do usuário em Meus dados (guardada em S.tema)
const aplicarTema = () => { const claro = S.tema === "claro", r = document.documentElement;
  if (claro) r.dataset.theme = "light"; else delete r.dataset.theme;
  const mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute("content", claro ? "#E3E3E0" : "#1E1E20"); };
aplicarTema();
// Números digitados no formato brasileiro: "4,90", "4.90", "12.000", "12000", "R$ 1.234,56". null = vazio; NaN = inválido.
// (Campos de texto: o campo numérico do navegador lê "4,90" como 490 e "12.000" como 12.)
const numBR = (v) => { let t = String(v ?? "").replace(/R\$|\s/g, ""); if (!t) return null;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  return /^-?\d*\.?\d+$/.test(t) ? Number(t) : NaN; };
const fmtBR = (n, dec) => n === null || n === undefined || n === "" ? "" : Number(n).toLocaleString("pt-BR", {minimumFractionDigits: dec, maximumFractionDigits: dec});
const TESTE = /[?&]teste=1/.test(location.search);   // modo teste: deixa escolher o dia dos preços
if (!TESTE || !SNAP.por_data[S.data]) S.data = SNAP.data;
const DIAS_VELHOS = Math.floor((Date.now() - new Date(SNAP.data + "T12:00:00Z")) / 86400000), DEFASADO = DIAS_VELHOS > 5 && !TESTE;
let tela = "obj", tese = null, ciente = false, slider = null, per = "90", pDe = "", pAte = "", selId = null, perfilAberto = false, ativoAberto = false;
const opSel = () => load("historico", []).find(o => o.id === selId) || null;
const abertas = () => { const hoje = S.data; return load("historico", []).filter(o => { const rep = fechamentoNoVenc(o.ativo, o.data, o.m.dias); return !(rep && rep.venc <= hoje) && !STATUS.get(o.id)?.saida; }); };

// --- Marcação diária: preços de fechamento das opções (pwa/precos/AAAA-MM-DD.json, publicados pelo atualizador) ---
// Cada operação simulada é marcada dia a dia: "Se encerrar hoje" e a primeira regra de saída atingida (alvo, limite,
// prazo). Calculado em segundo plano; sem os arquivos (offline, abrir do disco) tudo segue pelo vencimento.
const PRECOS = new Map(), STATUS = new Map(); let statusDia = null, marcando = false;
const precosDia = (d) => { if (!PRECOS.has(d)) PRECOS.set(d, location.protocol === "file:" ? Promise.resolve(null) : fetch(`precos/${d}.json`).then(r => r.ok ? r.json() : null).then(j => (j && j.op) || null).catch(() => null)); return PRECOS.get(d); };
async function marcarOp(o){
  const venc = addDias(o.data, o.m.dias), ate = venc < S.data ? venc : S.data;
  const dias = Object.keys(SNAP.fechamentos[o.ativo] || {}).filter(d => d >= o.data && d <= ate).sort();
  const ps = await Promise.all(dias.map(precosDia));
  const marcas = dias.map((d, i) => ({d, r: ps[i] ? M.resultadoNoDia(o.m, ps[i]) : null}));
  return {saida: M.regraDeSaida(o.m, marcas.filter(x => x.d > o.data), venc), hoje: marcas.filter(x => x.r !== null && x.d < venc).pop() || null};
}
async function atualizarStatus(){
  if (marcando) return; marcando = true;
  try {
    if (statusDia !== S.data) { STATUS.clear(); statusDia = S.data; }
    const hs = load("historico", []).filter(o => !STATUS.has(o.id));
    const res = await Promise.all(hs.map(o => marcarOp(o).catch(() => ({saida: null, hoje: null}))));
    hs.forEach((o, i) => STATUS.set(o.id, res[i]));
    if (hs.length && (tela === "acomp" || tela === "desemp")) render();
  } finally { marcando = false; }
}
const COMO = {alvo: "saiu no alvo", limite: "saiu no limite", prazo: "saiu no prazo", vencimento: "venceu"};

function load(k, d){ try{ const v = localStorage.getItem(k); if (!v) return d; const j = JSON.parse(v); return (d && typeof d === "object") ? Object.assign(d, j) : j; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const brl = (v, d=0) => (v<0?"−":"") + "R$ " + Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn = (v) => (v>0?"+":"") + brl(v);
const pct = (v) => Math.round(v*100) + "%";
const dBR = (iso) => iso.split("-").reverse().join("/");
const addDias = (iso, n) => { const d = new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const dia = () => SNAP.por_data[S.data][S.ativo];
const vencs = () => [...new Set(dia().chain.filter(x=>x.d>=10 && x.d<=150).map(x=>x.d))].sort((a,b)=>a-b).map(d=>({d, iso:addDias(S.data,d)}));
const vencSel = () => { const L = vencs(); if (!L.length) return {d:S.prazo||45, iso:addDias(S.data,S.prazo||45)}; return L.find(v=>v.iso===S.venc) || L.slice().sort((a,b)=>Math.abs(a.d-(S.prazo||45))-Math.abs(b.d-(S.prazo||45)))[0]; };
const sinalVals = () => { const a = dia(), g = S.sinal || (S.sinal = {entrada:null, alvo:null, prazo:20, est:"trava"}); return {entrada: g.entrada ?? Math.round(a.S*100)/100, alvo: g.alvo ?? Math.round(a.S*1.06*100)/100, prazo: g.prazo || 20, est: g.est || "trava"}; };
const PFS = ["eq","maior","freq"];
const pfMont = (t, p) => { const a = dia(); return M.montarAposta(t==="aposta_alta"?"alta":"baixa", a.S, a.chain, a.iv, S.perda || 300, {perfil: p}); };
const pfDisp = (t, p) => typeof pfMont(t, p) !== "string";
const pfAtual = (t) => { const p = S.pf || "eq"; if (pfDisp(t, p)) return p; return PFS.find(x => pfDisp(t, x)) || p; };
const montagem = (t) => { const a = dia();
  if (t === "aposta_alta" || t === "aposta_baixa") return limiteRisco(M.montarAposta(t==="aposta_alta"?"alta":"baixa", a.S, a.chain, a.iv, S.perda || 300, {perfil: pfAtual(t)}));
  if (t === "sinal_alta" || t === "sinal_put") { const g = sinalVals(), f = (caixa) => M.montarSinal(a.S, a.chain, a.iv, S.perda, g.entrada, g.alvo, g.prazo, {estrutura: t==="sinal_put"?"put":"trava", caixa}); return limiteRisco(f(S.capital), f); }
  const f = (caixa) => M.montar(t, a.S, a.chain, a.iv, S.perda, {prazoAlvo:vencSel().d, caixa});
  return limiteRisco(f(S.capital), f); };
// O risco máximo por operação do perfil vale para toda operação. A put vendida é dimensionada pelo caixa no montador;
// aqui o número de lotes é reduzido para caber no limite. Se nem a menor operação cabe, o cartão informa quanto o
// limite precisaria ser (informação, não sugestão de aumentar).
const msgLimite = (v) => `A menor operação arrisca ${v}. Seu risco máximo por operação é ${brl(S.perda)}: para ver esta operação, ele precisaria ser de pelo menos ${v}.`;
function limiteRisco(m, refazer){
  if (typeof m === "string") { const x = m.match(/^A menor operação (?:arrisca|perde|custa) (R\$ [\d.]+)/); return x ? msgLimite(x[1]) : m; }
  if (m.perdaMax <= S.perda) return m;
  const r1 = m.perdaMax / m.lotes, caixa1 = m.pernas[0][1].k * 100;
  if (refazer && r1 <= S.perda) { const m2 = refazer(Math.min(S.capital, Math.floor(S.perda / r1) * caixa1)); if (typeof m2 !== "string" && m2.perdaMax <= S.perda) return m2; }
  return msgLimite(brl(Math.ceil(r1)));
}
const esc = (s) => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg = (p, w=24) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

// resultado real no vencimento, se o vencimento já ocorreu nos dados
function fechamentoNoVenc(ativo, iso, dias){
  const venc = addDias(iso, dias), f = SNAP.fechamentos[ativo], ult = Object.keys(f).sort().pop();
  if (venc > ult) return null;
  const ds = Object.keys(f).filter(d => d <= venc).sort(); const d = ds.pop();
  return {data:d, venc, preco:f[d]};
}

function navBar(){
  const at = tela==="acomp" ? "acomp" : tela==="desemp" ? "desemp" : tela==="cad" ? "cad" : "obj";
  const it = (k, rot, ic) => `<button data-nav="${k}" ${at===k?'aria-current="page"':""}>${svg(ic,22)}${rot}</button>`;
  document.getElementById("nav").innerHTML = `<div class="in">${it("obj","Início",'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>')}${it("acomp","Operações",'<path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-5 3 3 4-6"/>')}${it("desemp","Desempenho",'<path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-6"/>')}${it("cad","Meus dados",'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>')}</div>`;
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { selId = null; slider = null; tela = b.dataset.nav; render(); });
}
function render(){
  // o ativo salvo pode não existir no dia carregado (papel novo que ficou de fora num pregão, ou dia antigo no ?teste=1)
  { const doDia = SNAP.por_data[S.data]; if (!doDia[S.ativo]) S.ativo = doDia.PETR4 ? "PETR4" : Object.keys(doDia)[0]; }
  const el = document.getElementById("app");
  el.innerHTML = tela==="obj" ? vObj() : tela==="cartao" ? vCartao() : tela==="cen" ? vCen() : tela==="desemp" ? vDesemp() : tela==="cad" ? vCad() : tela==="sinal" ? vSinal() : vAcomp();
  window.scrollTo(0,0);
  navBar();
  bind();
}
const topo = (back, label, passo) => `<div class="top">${back?`<button class="back" data-go="${back}">‹ ${label}</button>`:`<span class="small muted" style="font-weight:600">Passo ${passo} de 4</span>`}<span>${back?`<span class="small muted" style="font-weight:600;margin-right:8px">Passo ${passo} de 4</span>`:""}<span class="pill sim">Modo simulado</span></span></div>`;

function listaAtivos(q){ q = (q||"").trim().toUpperCase(); const d = SNAP.por_data[S.data];
  const L = Object.keys(d).filter(n => n.includes(q)).sort();
  return L.length ? L.map(n => `<button class="opt" role="option" data-ativo="${n}" aria-selected="${n===S.ativo}" style="border:0;border-top:1px solid var(--line);border-radius:0;justify-content:space-between;align-items:center;padding:12px 6px;${n===S.ativo?"font-weight:700":""}"><span>${n}</span><span class="muted">${brl(d[n].S,2)}</span></button>`).join("") : `<p class="small muted" style="padding:12px 6px">Nenhum ativo encontrado.</p>`; }
function vObj(){
  const a = dia();
  let h = topo(null,"",1) + `<h1>Monte sua operação</h1>`;

function cenarios(m){

  if (m.tese === "alta_com_caixa" || m.tese === "sinal_put") pts.push({p: 0, zero: true});
  const un = new Map(); for (const x of pts) { const k = x.p.toFixed(2); if (!un.has(k) || x.eq || x.zero) un.set(k, x); }
  return [...un.values()].sort((x,y) => x.p - y.p).map(x => ({...x, r: x.eq ? 0 : M.resultadoNoVencimento(m, x.p)}));
}

  const abertas = linhas.filter(l => !l.real);
  const tot = fim.reduce((a,l)=>a+l.res,0), gan = fim.filter(l=>l.res>0), per_ = fim.filter(l=>l.res<0);
  const chip = (k, t) => `<button class="chip${per===k?" on":""}" data-per="${k}" style="padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:${per===k?"var(--ink)":"transparent"};color:${per===k?"var(--bg)":"inherit"};font:inherit;font-size:14px;font-weight:600;cursor:pointer">${t}</button>`;
  let h = `<div class="top"><button class="back" data-go="obj">‹ Início</button><span class="pill sim">Modo simulado</span></div><h1>Meu desempenho</h1><p class="muted">Resultado das suas operações simuladas já encerradas, antes de imposto.</p>`;
  h += `<section class="card"><div style="display:flex;gap:8px;flex-wrap:wrap">${chip("30","30 dias")}${chip("90","90 dias")}${chip("365","12 meses")}${chip("tudo","Tudo")}${chip("pers","Período")}</div>`;
  if (per==="pers") h += `<div class="row3" style="margin-top:10px"><label class="f">De<input id="pde" type="date" value="${pDe}"></label><label class="f">Até<input id="pate" type="date" value="${pAte}"></label></div>`;
  h += `</section>`;
  h += `<section class="card"><div class="small muted">Resultado no período</div><div style="font-size:32px;font-weight:700;color:${tot>0?"var(--good)":tot<0?"var(--bad)":"inherit"}">${tot===0?"R$ 0":sgn(tot)}</div>
   <div class="row3" style="border-top:1px solid var(--line);padding-top:10px;margin-top:8px"><div><div class="small muted">Operações</div><div style="font-weight:700">${fim.length}</div></div><div><div class="small muted">Com ganho</div><div style="font-weight:700;color:var(--good)">${gan.length}</div></div><div><div class="small muted">Com resultado negativo</div><div style="font-weight:700;color:var(--bad)">${per_.length}</div></div></div></section>`;
  if (!fim.length) { const prox = abertas.map(l => l.venc).sort()[0], venceu = linhas.some(l => l.real);
    const dica = venceu ? `Escolha outro período para ver as operações já encerradas.${prox ? ` A próxima em aberto vence em ${dBR(prox)}.` : ""}`
      : prox ? `O resultado aparece aqui quando suas operações forem encerradas, por uma regra de saída ou no vencimento. A próxima vence em ${dBR(prox)}.`
      : `Monte uma operação e confirme a simulação; o resultado aparece aqui no vencimento.`;
    h += `<div class="card empty"><p>Nenhuma operação encerrada neste período.</p><p class="small" style="margin-top:6px">${dica}</p></div>`; }
  else h += `<section class="card"><h2 style="font-size:16px">Operações do período</h2>` + fim.map(l => `<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)"><div><div style="font-weight:600">${esc(l.o.m.estrutura)} · ${l.o.ativo}</div><div class="small muted">Entrada ${dBR(l.o.data)} · ${COMO[l.como]} em ${dBR(l.fecha)}</div></div><div style="font-weight:700;white-space:nowrap;color:${l.res>0?"var(--good)":l.res<0?"var(--bad)":"inherit"}">${l.res===0?"R$ 0":sgn(l.res)}</div></div>`).join("") + `</section>`;
  if (abertas.length && fim.length) h += `<p class="foot">${abertas.length} ${abertas.length>1?"operações ainda estão em aberto e ficam":"operação ainda está em aberto e fica"} fora do resultado.</p>`;
  h += `<p class="foot">Cada operação sai na primeira regra atingida (alvo, limite ou prazo), conferida no fechamento de cada dia, ou no vencimento. Dia sem preço da opção fica de fora da conferência.</p><button class="btn sec2" id="limpar-hist">Apagar histórico</button>`;
  return h;
}

function vLista(){
  const L = abertas(), tot = L.reduce((a,o)=>a+o.m.perdaMax,0);
  const caixa = L.filter(o => o.m.tese === "alta_com_caixa" || o.m.tese === "sinal_put").reduce((a,o)=>a+o.m.pernas[0][1].k*100*o.m.lotes,0);   // compra obrigatória: caixa preso até o vencimento
  let h = `<div class="top"><button class="back" data-go="obj">‹ Início</button><span class="pill sim">Modo simulado</span></div><h1>Minhas operações</h1>`;
  if (!L.length) return h + `<div class="card empty"><p>Nenhuma operação em aberto.</p><p class="small" style="margin-top:6px">Monte uma operação e confirme a simulação para acompanhá-la aqui.</p></div><button class="btn" data-go="obj">Montar operação</button>`;
  h += `<section class="card"><div class="small muted">Em aberto</div><div style="font-size:24px;font-weight:700">${L.length} operaç${L.length>1?"ões":"ão"}</div><div class="row3" style="border-top:1px solid var(--line);padding-top:10px;margin-top:8px"><div><div class="small muted">Risco máximo somado</div><div style="font-weight:700">${brl(tot)}</div></div><div><div class="small muted">Do seu capital</div><div style="font-weight:700">${(tot/S.capital*100).toLocaleString("pt-BR",{maximumFractionDigits:1})}%</div></div>${caixa>0?`<div><div class="small muted">Caixa reservado</div><div style="font-weight:700">${brl(caixa)}</div></div>`:""}</div></section>`;
  h += L.slice().sort((a,b)=>addDias(a.data,a.m.dias).localeCompare(addDias(b.data,b.m.dias))).map(o => `<button class="opt" data-op="${o.id}"><span class="tx"><span class="t">${esc(o.m.estrutura)} · ${o.ativo}</span><span class="st"><span style="flex-basis:100%">Vence ${dBR(addDias(o.data,o.m.dias))} · <span style="white-space:nowrap">risco máx. ${brl(o.m.perdaMax)}</span></span><span class="small" style="flex-basis:100%;margin-top:-4px">Entrada em ${dBR(o.data)}</span></span></span></button>`).join("");
  return h + `<button class="btn" data-go="obj">Montar operação</button>`;
}
function vCad(){
  const c = S.cad;
  let h = `<div class="top"><button class="back" data-go="obj">‹ Início</button><span class="pill sim">Modo simulado</span></div><h1>Meus dados</h1><p class="muted">Estes dados ficam guardados só neste aparelho.</p>`;
  h += `<section class="card"><label class="f">Corretora<select id="ccorr"><option value="">Escolha…</option>${CORRETORAS.map(n=>`<option ${n===c.corretora?"selected":""}>${n}</option>`).join("")}</select></label>
   <label class="f">Corretagem por ordem de opções (R$)<input id="ccorrtg" type="text" inputmode="decimal" autocomplete="off" placeholder="Não sei" value="${fmtBR(c.corretagem,2)}"></label>
   <p class="small muted">${c.corretagem===null?"Sem este valor, o custo das operações não inclui corretagem. Os custos aparecem em Detalhes da operação.":`O custo das operações usa ${brl(c.corretagem,2).replace(" ","&nbsp;")} por ordem, na entrada e na saída de cada perna. Aparece em Detalhes da operação.`} Consulte a tabela da sua corretora; o app não confere esse valor.</p></section>`;
  h += `<section class="card" aria-label="Aparência"><h2 style="font-size:16px">Aparência</h2><div role="group" aria-label="Tema" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[["escuro","Escuro"],["claro","Claro"]].map(([k,n]) => { const on = (S.tema||"escuro") === k; return `<button class="seg" data-tema="${k}" aria-pressed="${on}" style="min-height:48px;padding:8px 10px;border-radius:12px;border:1.5px solid ${on?"var(--ink)":"var(--line)"};background:${on?"var(--ink)":"transparent"};color:${on?"var(--bg)":"inherit"};font:inherit;font-size:15px;font-weight:600;cursor:pointer">${n}</button>`; }).join("")}</div></section>`;
  h += `<section class="card"><h2 style="font-size:16px">Seus dados neste aparelho</h2><p class="small muted">Apaga a corretora, o perfil, o tema, as operações simuladas e o histórico.</p><button class="btn danger" id="apagar-tudo">Apagar meus dados</button></section>`;
  return h;
}

function vAcomp(){
  if (selId===null || !opSel()) return vLista();
  const P = opSel();
  let h = `<div class="top"><button class="back" data-op="">‹ Operações</button><span class="pill sim">Modo simulado</span></div><h1>Sua operação</h1>`;
  if (!P || !P.m){ return h + `<div class="card empty"><p>Nenhuma operação simulada ainda.</p><p class="small" style="margin-top:6px">Monte uma operação e confirme a simulação para acompanhá-la aqui.</p></div><button class="btn" data-go="obj">Montar operação</button>`; }
  // A cadeia do dia da entrada sai do snapshot depois de 12 pregões; o preço da ação daquele dia continua em fechamentos.
  const m = P.m, a = {S: SNAP.por_data[P.data]?.[P.ativo]?.S ?? SNAP.fechamentos[P.ativo]?.[P.data] ?? SNAP.ativos[P.ativo].S};
  const ateZero = m.tese === "alta_com_caixa" || m.tese === "sinal_put";   // compra obrigatória: a zona de risco vai até a ação a R$ 0
  const lo = ateZero ? 0 : Math.round(a.S*0.8*100)/100, hi = Math.round(a.S*1.2*100)/100; if (slider===null || slider<lo || slider>hi) slider = Math.round(a.S*100)/100;
  const r = M.resultadoNoVencimento(m, slider);
  const pior = -m.perdaMax, melhor = m.ganhoMax===null ? m.perdaMax*2 : m.ganhoMax, span = melhor - pior, pos = Math.min(100,Math.max(0,(r-pior)/span*100)), zero = (0-pior)/span*100;
  const rep = fechamentoNoVenc(P.ativo, P.data, m.dias);
  h += `<div class="small muted">${esc(m.estrutura)} · ${P.ativo} · entrada em ${dBR(P.data)}</div>`;
  { const st = STATUS.get(P.id), REGRA = {alvo: "A regra “Sair no alvo” foi atingida", limite: "A regra “Sair no limite” foi atingida", prazo: "Chegou o prazo de saída"};
    if (st && st.hoje) h += `<section class="card"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><div><div class="small muted">Se encerrar hoje</div><div style="font-size:26px;font-weight:700;color:${st.hoje.r>0?"var(--good)":st.hoje.r<0?"var(--bad)":"inherit"}">${st.hoje.r===0?"R$ 0":sgn(st.hoje.r)}</div></div><div class="small muted" style="text-align:right">Fechamento de<br>${dBR(st.hoje.d)}</div></div>
      <p class="small muted" style="margin-top:6px">Pelos preços de fechamento das opções, no lado menos favorável de cada perna.</p>${st.saida?`<p class="small" style="margin-top:6px"><strong>${REGRA[st.saida.regra]}</strong> no fechamento de ${dBR(st.saida.d)} (${sgn(st.saida.r)}).</p>`:""}</section>`; }
  h += `<section class="card"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><div><div class="small muted">Resultado no vencimento, se a ação estiver em</div><div id="rv" style="font-size:30px;font-weight:700;color:${r>0?"var(--good)":r<0?"var(--bad)":"inherit"}">${r===0?"R$ 0":sgn(r)}</div></div><div style="text-align:right"><div class="small muted">Ação</div><div id="px" style="font-size:20px;font-weight:700;white-space:nowrap">${brl(slider,2)}</div></div></div>
   <input id="sl" type="range" min="${lo}" max="${hi}" step="0.01" value="${slider}" aria-label="Preço da ação no vencimento">
   <div><div class="small muted" style="display:flex;justify-content:space-between"><span>Risco máx. ${sgn(pior)}</span><span>${m.ganhoMax===null?"Sem teto":"Ganho máx. "+sgn(m.ganhoMax)}</span></div><div class="bar" role="img" aria-label="Posição do resultado entre o risco máximo e o ganho máximo"><i style="left:${zero}%"></i><b id="bb" style="background:${r>=0?"var(--good)":"var(--bad)"};left:${Math.min(pos,zero)}%;width:${Math.abs(pos-zero)}%"></b></div></div>
   <div class="row3" style="border-top:1px solid var(--line);padding-top:10px">${m.premio >= 0 && Math.abs(m.premio - m.perdaMax) < 1 ? `<div><div class="small muted">Você pagou · é o risco máximo</div><div style="font-weight:700">${brl(m.perdaMax)}</div></div>`
     : `<div><div class="small muted">${m.premio < 0 ? "Você recebeu" : "Você pagou"}</div><div style="font-weight:700">${brl(Math.abs(m.premio))}</div></div><div><div class="small muted">Risco máx.</div><div style="font-weight:700">${brl(m.perdaMax)}</div></div>`}<div><div class="small muted">Vence em</div><div style="font-weight:700">${dBR(addDias(P.data,m.dias))}</div></div></div></section>`;
  h += `<section class="card"><h2 style="font-size:16px">Quando sair</h2><p class="small muted">Regras definidas na entrada. Elas não mudam com o humor do mercado.</p>
   ${m.alvo!==null?`<div class="step"><span class="n" style="background:var(--good-soft);color:var(--good)">✓</span><p><strong>Sair no alvo: ${sgn(m.alvo)}</strong><br><span class="muted small">Metade do ganho máximo.</span></p></div>`:""}
   ${m.stop!==null?`<div class="step"><span class="n" style="background:var(--bad-soft);color:var(--bad)">!</span><p><strong>Sair no limite: ${sgn(m.stop)}</strong><br><span class="muted small">Antes de chegar ao risco máximo. Valor padrão do app.</span></p></div>`:`<div class="step"><span class="n" style="background:var(--bad-soft);color:var(--bad)">!</span><p><strong>Sem regra de saída automática</strong><br><span class="muted small">O risco é tudo o que pagou (${brl(m.perdaMax)}).</span></p></div>`}
   ${m.saidaDias>0?`<div class="step"><span class="n" style="background:var(--warn-soft);color:var(--warn-text)">7</span><p><strong>Prazo: sair até ${m.saidaDias} dias antes do vencimento</strong><br><span class="muted small">Em ${dBR(addDias(P.data,m.dias-m.saidaDias))}.</span></p></div>`:`<div class="step"><span class="n" style="background:var(--warn-soft);color:var(--warn-text)">7</span><p><strong>Vencimento em ${dBR(addDias(P.data,m.dias))}</strong><br><span class="muted small">Se o preço não passar do ponto de equilíbrio, a opção vale zero.</span></p></div>`}</section>`;
  h += custosHtml(m, P.cor ?? null);
  if (rep){ const rr = M.resultadoNoVencimento(m, rep.preco); h += `<section class="card"><h2 style="font-size:16px">Como terminou de verdade</h2><p class="small">Em ${dBR(rep.venc)}, ${P.ativo} fechou em ${brl(rep.preco,2)}. Resultado: <strong style="color:${rr>0?"var(--good)":rr<0?"var(--bad)":"inherit"}">${rr===0?"R$ 0":sgn(rr)}</strong>, antes de imposto.</p></section>`; }
  h += `<p class="foot">Valores calculados com preços de fechamento reais, em modo simulado.</p><button class="btn sec2" id="copiar">Copiar parâmetros</button><textarea id="cpbox" class="small" hidden readonly rows="6" style="width:100%;margin-top:8px"></textarea><button class="btn danger" id="encerrar">Encerrar operação simulada</button>`;
  return h;
}

function bind(){
  const q = (s) => document.querySelector(s);
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { tela = b.dataset.go; render(); });
  document.querySelectorAll("[data-op]").forEach(b => { const prev = b.onclick; b.onclick = () => { selId = b.dataset.op ? +b.dataset.op : null; slider = null; tela = "acomp"; render(); }; });
  document.querySelectorAll("[data-tese]").forEach(b => b.onclick = () => { tese = b.dataset.tese; ciente = false; tela = "cartao"; render(); });
  const set = (id, key, num) => { const e = q("#"+id); if (e) e.onchange = () => { if (num) { const n = numBR(e.value); if (n > 0) S[key] = Math.round(n); } else S[key] = e.value; save("estado", S); render(); }; };
  set("capital","capital",true); set("perda","perda",true); set("data","data");
  ["data"].forEach(id => { const e = q("#"+id); if (e){ const f = e.onchange; e.onchange = () => { S.sinal = Object.assign(S.sinal||{}, {entrada:null, alvo:null}); f(); }; } }); 
  const sg = (id, key, f) => { const e = q("#"+id); if (e) e.onchange = () => { S.sinal = S.sinal || {}; S.sinal[key] = f(e.value); save("estado", S); render(); }; };
  sg("sentrada","entrada",v=>numBR(v)>0?numBR(v):null); sg("salvo","alvo",v=>numBR(v)>0?numBR(v):null); sg("sprazo","prazo",v=>Math.max(5,+v||20)); sg("sest","est",v=>v);
  const p = q("#prazo"); if (p) p.onchange = () => { S.venc = p.value; S.prazo = vencSel().d; save("estado", S); render(); };
  const c = q("#ciente"); if (c) c.onchange = () => { ciente = c.checked; q("#confirmar").disabled = !ciente; };
  const cf = q("#confirmar"); if (cf) cf.onclick = () => { const m = montagem(tese); if (typeof m==="string") return; { const hs = load("historico", []); selId = Date.now(); hs.push({m, ativo:S.ativo, data:S.data, id:selId, cor:S.cad.corretagem}); save("historico", hs); } slider = null; tela = "acomp"; render(); atualizarStatus(); };
  const sl = q("#sl"); if (sl) sl.oninput = () => {
    slider = +sl.value; const P = opSel(), m = P.m, r = M.resultadoNoVencimento(m, slider);
    const pior = -m.perdaMax, melhor = m.ganhoMax===null ? m.perdaMax*2 : m.ganhoMax, span = melhor - pior, pos = Math.min(100,Math.max(0,(r-pior)/span*100)), zero = (0-pior)/span*100;
    const rv = q("#rv"); rv.textContent = r===0 ? "R$ 0" : sgn(r); rv.style.color = r>0 ? "var(--good)" : r<0 ? "var(--bad)" : "inherit";
    q("#px").textContent = brl(slider,2); const bb = q("#bb"); bb.style.background = r>=0 ? "var(--good)" : "var(--bad)"; bb.style.left = Math.min(pos,zero)+"%"; bb.style.width = Math.abs(pos-zero)+"%";
  };
  const cp = q("#copiar"); if (cp) cp.onclick = () => { if (DEFASADO) { cp.textContent = "Bloqueado: preços desatualizados"; return; } if (tela==="acomp"){ const P = opSel(); if (P && P.m) copiar(textoParametros(P.m, P.ativo, P.data), cp); } else { const m = montagem(tese); if (typeof m!=="string") copiar(textoParametros(m, S.ativo, S.data), cp); } };
  document.querySelectorAll("[data-per]").forEach(b => b.onclick = () => { per = b.dataset.per; render(); });
  const pd = q("#pde"); if (pd) pd.onchange = () => { pDe = pd.value; render(); }; const pa = q("#pate"); if (pa) pa.onchange = () => { pAte = pa.value; render(); };
  const lh = q("#limpar-hist"); if (lh) lh.onclick = () => { if (confirm("Apagar todo o histórico de operações simuladas?")){ try{ localStorage.removeItem("historico"); }catch(e){} render(); } };
  const pickAtv = (b) => b.onclick = () => { S.ativo = b.dataset.ativo; S.sinal = Object.assign(S.sinal||{}, {entrada:null, alvo:null}); ativoAberto = false; save("estado", S); render(); };
  document.querySelectorAll("[data-ativo]").forEach(pickAtv);
  const ab = q("#atvBtn"); if (ab) ab.onclick = () => { ativoAberto = !ativoAberto; render(); const i = q("#atvQ"); if (i) i.focus(); };
  const aq = q("#atvQ"); if (aq) aq.oninput = () => { q("#atvL").innerHTML = listaAtivos(aq.value); document.querySelectorAll("#atvL [data-ativo]").forEach(pickAtv); };
  document.querySelectorAll("[data-perfil]").forEach(b => b.onclick = () => { perfilAberto = b.dataset.perfil === "1"; render(); });
  document.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { S.pf = b.dataset.pf; save("estado", S); render(); });
  document.querySelectorAll("[data-estr]").forEach(b => b.onclick = () => { tese = b.dataset.estr; ciente = false; render(); });
  const sv = () => { save("estado", S); M.setCorretagem(S.cad.corretagem); };
  const cc = q("#ccorr"); if (cc) cc.onchange = () => { S.cad.corretora = cc.value; sv(); };
  const ct = q("#ccorrtg"); if (ct) ct.onchange = () => { const n = numBR(ct.value); S.cad.corretagem = n === null || !(n >= 0) ? null : Math.round(n*100)/100; sv(); render(); };
  document.querySelectorAll("[data-tema]").forEach(b => b.onclick = () => { S.tema = b.dataset.tema; save("estado", S); aplicarTema(); render(); });
  const ap = q("#apagar-tudo"); if (ap) ap.onclick = () => { if (confirm("Apagar todos os seus dados neste aparelho?")){ try{ ["estado","historico","posicao"].forEach(k=>localStorage.removeItem(k)); }catch(e){} location.reload(); } };
  const en = q("#encerrar"); if (en) en.onclick = () => { save("historico", load("historico", []).filter(o => o.id !== selId)); selId = null; tela = "acomp"; render(); };
}
render();
atualizarStatus();
</script>
